name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DEAL_II_DIR: ${{ github.workspace }}/.deps/dealii-9.8.0
      OMPI_MCA_rmaps_base_oversubscribe: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl \
            libboost-program-options-dev libboost-serialization-dev \
            liblapack-dev libgtest-dev \
            openmpi-bin libopenmpi-dev libhdf5-openmpi-dev \
            python3-dev python3-venv

      - name: Restore deal.II installation
        id: dealii
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.DEAL_II_DIR }}
          key: ubuntu-24.04-${{ runner.arch }}-dealii-9.8.0-${{ hashFiles('.github/scripts/build_dealii.sh', '.github/workflows/tests.yml') }}

      - name: Build deal.II 9.8.0
        if: steps.dealii.outputs.cache-hit != 'true'
        run: |
          bash .github/scripts/build_dealii.sh "$DEAL_II_DIR" "$RUNNER_TEMP/dealii"

      - name: Cache deal.II installation
        if: steps.dealii.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.DEAL_II_DIR }}
          key: ${{ steps.dealii.outputs.cache-primary-key }}

      - name: Prepare Python environment
        run: |
          /usr/bin/python3 -m venv .venv
          .venv/bin/python -m pip install \
            "numpy<2" mpi4py meshio "libensemble==1.6.1"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Build MPI-enabled h5py
        run: |
          export CC=mpicc
          export HDF5_MPI=ON
          python -m pip install --no-binary=h5py h5py
          python -c \
            "import h5py; assert h5py.get_config().mpi, 'MPI-enabled h5py is required'"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDEAL_II_DIR="$DEAL_II_DIR" \
            -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/.venv/bin/python"

      - name: Build
        run: cmake --build build --parallel 4

      - name: Run C++ and Python tests
        run: ctest --test-dir build --output-on-failure --no-tests=error
